name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name MetaAdsScraper app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MetaAdsScraper-windows
          path: dist/MetaAdsScraper.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MetaAdsScraper.exe

  macos:
    runs-on: macos-latest  # Apple Silicon (M1 and newer)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --name MetaAdsScraper --osx-bundle-identifier com.metaads.scraper app.py
      # ditto keeps the .app bundle intact (plain zip can break it)
      - run: ditto -c -k --keepParent dist/MetaAdsScraper.app dist/MetaAdsScraper-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MetaAdsScraper-macos
          path: dist/MetaAdsScraper-macos.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MetaAdsScraper-macos.zip
