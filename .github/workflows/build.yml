name: Build apps

# Builds the Windows .exe and macOS .app and publishes them as public GitHub Release downloads:
#   push to main  -> rolling "latest" release (same download links, always the newest build)
#   push tag v1.2 -> permanent "v1.2" release
# Public links (repo must be public):
#   https://github.com/<owner>/<repo>/releases/latest/download/MetaAdsScraper.exe
#   https://github.com/<owner>/<repo>/releases/latest/download/MetaAdsScraper-macos.zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name MetaAdsScraper app.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MetaAdsScraper.exe

  macos:
    runs-on: macos-latest  # Apple Silicon (M1 and newer)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --windowed --name MetaAdsScraper --osx-bundle-identifier com.metaads.scraper app.py
      # ditto keeps the .app bundle intact (plain zip can break it)
      - run: ditto -c -k --keepParent dist/MetaAdsScraper.app dist/MetaAdsScraper-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/MetaAdsScraper-macos.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Meta Ads Scraper $GITHUB_REF_NAME" \
            --notes "Windows: MetaAdsScraper.exe · macOS (Apple Silicon): MetaAdsScraper-macos.zip" \
            --latest

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Windows: MetaAdsScraper.exe · macOS (Apple Silicon): MetaAdsScraper-macos.zip" \
            --latest
